<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Employee Interests Survey Form</title>
        <meta name="description" content="A short survey form about an employee’s interests, exercise and reading habits." />
        <meta property="og:title" content="Employee Interests Survey" />
        <meta property="og:description" content="A short survey form about an employee’s interests, exercise and reading habits." />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="https://samarthjaiswal.github.io/IE-E-C-Task-1/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <style>
            body {
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                text-align: center;
                margin: 0;
                padding: 1rem;
            }

            form {
                max-width: 40rem;
                margin: 0 auto;
            }

            .field {
                margin: 1.25rem 0;
            }

            input[type="text"],
            textarea,
            select {
                font: inherit;
                max-width: 100%;
            }

            fieldset {
                border: none;
                margin: 1.25rem 0;
                padding: 0;
            }

            legend {
                margin: 0 auto 0.5rem;
            }

            .options label {
                display: inline-block;
                margin: 0.25rem 0.5rem;
            }

            #result {
                margin-top: 1.5rem;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <h1>Employee Interests Survey form</h1>

        <form id="survey">
            <div class="field">
                <label for="name">Enter Your Name:</label>
                <input type="text" id="name" name="name" required />
            </div>

            <div class="field">
                <label for="dept">Enter Your department:</label>
                <input type="text" id="dept" name="dept" />
            </div>

            <div class="field">
                <label for="intro">Tell us a little about yourself:</label><br>
                <textarea id="intro" name="intro" rows="3" cols="30" placeholder="Enter data"></textarea>
            </div>

            <fieldset>
                <legend>Do you exercise at home?</legend>
                <div class="options">
                    <label><input type="radio" name="exercise" value="Yes" /> Yes</label>
                    <label><input type="radio" name="exercise" value="No" /> No</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>How do you like to read about your favorite topics?</legend>
                <div class="options">
                    <label><input type="checkbox" name="reading" value="Books"> Books</label>
                    <label><input type="checkbox" name="reading" value="Online Resources"> Online Resources</label>
                    <label><input type="checkbox" name="reading" value="Phone Apps"> Phone Apps</label>
                    <label><input type="checkbox" name="reading" value="Magazines"> Magazines</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="movies">What genre of movies do you like?</label>
                <select name="movies" id="movies">
                    <option value="Comedy">Comedy</option>
                    <option value="Suspense">Suspense</option>
                    <option value="Thrill">Thrill</option>
                    <option value="Horror">Horror</option>
                </select>
            </div>

            <button type="submit" id="btn">Submit Form</button>
            <p id="result" role="status" aria-live="polite"></p>
        </form>

        <script>
            // No backend: the form is handled entirely in the browser.
            document.getElementById("survey").addEventListener("submit", function (event) {
                event.preventDefault();
                var name = document.getElementById("name").value.trim();
                document.getElementById("result").textContent =
                    "Thanks, " + name + "! Your responses were recorded locally (nothing is sent anywhere).";
            });
        </script>
    </body>
</html>
